name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        homebridge: ['1', '2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
        env:
          SHELLY_HOMEBRIDGE_VERSION: ${{ matrix.homebridge }}
      - run: npm pack --dry-run --ignore-scripts
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node test/ui-browser.cjs
        env:
          PLAYWRIGHT_CHANNEL: bundled
      - run: node test/scenes-i18n-browser.cjs
        env:
          PLAYWRIGHT_CHANNEL: bundled
      - run: node test/addon-ui-browser.cjs
        env:
          PLAYWRIGHT_CHANNEL: bundled
      - run: node test/addon-overview-browser.cjs
        env:
          PLAYWRIGHT_CHANNEL: bundled
      - run: node test/scene-dewpoint-browser.cjs
        env:
          PLAYWRIGHT_CHANNEL: bundled
      - run: node test/ws90-browser.cjs
        env:
          PLAYWRIGHT_CHANNEL: bundled
      - run: node test/shading-bthome-browser.cjs
        env:
          PLAYWRIGHT_CHANNEL: bundled
      - run: node test/scene-sensor-choices-browser.cjs
        env:
          PLAYWRIGHT_CHANNEL: bundled
      - run: node test/scene-current-reading-browser.cjs
        env:
          PLAYWRIGHT_CHANNEL: bundled

      - run: node test/defaults-browser.cjs
        env:
          PLAYWRIGHT_CHANNEL: bundled
